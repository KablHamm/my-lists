<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://api.github.com https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Lists</title>
<meta name="theme-color" content="#0e6b5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Lists">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: fixed list sidebar on the left, one list open on the right; sidebar becomes a drawer on phones. */
:root{
  --bg:#f4f5f2;
  --surface:#ffffff;
  --ink:#1c2321;
  --muted:#667069;
  --line:#dfe3dd;
  --accent:#0e6b5c;
  --accent-ink:#ffffff;
  --danger:#b3392b;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141a18;--surface:#1c2421;--ink:#e8ece9;--muted:#93a09a;--line:#2b3531;--accent:#4fc3a8;--accent-ink:#0b1512;--danger:#f08a7c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141a18;--surface:#1c2421;--ink:#e8ece9;--muted:#93a09a;--line:#2b3531;--accent:#4fc3a8;--accent-ink:#0b1512;--danger:#f08a7c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--font-body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:flex;height:100%}
.side{width:290px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{font:700 20px var(--font-display);padding:18px 18px 10px;letter-spacing:-.01em}
.search{padding:0 14px 10px}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.lists{flex:1;overflow-y:auto;padding:4px 8px 12px}
.grp{font:600 12px var(--font-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:14px 10px 4px}
.item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px}
.item.sub{padding-left:22px}
.item:hover{background:var(--bg)}
.item.on{background:var(--accent);color:var(--accent-ink)}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .ct{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.item.on .ct{color:var(--accent-ink);opacity:.85}
.sidefoot{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.sidefoot .pair{display:flex;gap:8px}
.sidefoot .pair .btn{flex:1}
.ver{color:var(--muted);font-size:12px;text-align:center;margin:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.6;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.newlist{display:flex;flex-direction:column;gap:6px}
.newlist input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.main{flex:1;min-width:0;overflow-y:auto;padding:24px clamp(16px,4vw,48px) 96px}
.wrap{max-width:720px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.menu{display:none}
h1{font:700 clamp(26px,4vw,34px)/1.1 var(--font-display);margin:0;letter-spacing:-.02em;text-wrap:balance;flex:1}
.meta{color:var(--muted);margin:2px 0 18px;font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.acts .btn{padding:5px 10px;font-size:14px}
.add{display:flex;gap:8px;margin-bottom:14px}
.add input{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tasks{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.task{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.tasks .task:first-child{border-radius:12px 12px 0 0}
.tasks .task:last-child{border-bottom:0;border-radius:0 0 12px 12px}
.tasks .task:only-child{border-radius:12px}
.task input[type=checkbox]{width:19px;height:19px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.task .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.task.done .tx{color:var(--muted);text-decoration:line-through}
.task .note{display:block;font-size:14px;color:var(--muted);white-space:pre-wrap;margin-top:2px;text-decoration:none}
.task .src{display:block;font-size:12px;color:var(--muted)}
.due{display:inline-block;margin-top:3px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--bg);color:var(--muted);text-decoration:none}
.due.today{color:var(--accent)}
.due.over{color:var(--danger)}
.task.done .due{display:none}
.duehead{font:600 13px var(--font-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px}
.duehead.over{color:var(--danger)}
.editbox .when{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.editbox .when label{flex:1;min-width:130px}
.editbox input[type=date],.editbox input[type=time]{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.editbox .chk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.item.duebtn{font-weight:600;margin-bottom:4px}
.item .ct.hot{color:var(--danger);font-weight:600}
.item.on .ct.hot{color:var(--accent-ink)}
.task .row-acts{display:flex;gap:2px;flex:none}
.task.dragging{position:relative;z-index:2;box-shadow:0 4px 16px rgba(0,0,0,.18);border-radius:10px}
.grip{border:0;background:none;color:var(--muted);padding:0 4px;margin:0 -8px 0 -8px;font-size:18px;line-height:1.25;cursor:grab;touch-action:none;flex:none;user-select:none;-webkit-user-select:none}
.grip:hover{color:var(--ink)}
.ic{border:0;background:none;color:var(--muted);padding:2px 7px;border-radius:6px;font-size:14px}
.ic:hover{color:var(--ink);background:var(--bg)}
.edit{flex:1;padding:6px 10px;border:1px solid var(--accent);border-radius:8px;background:var(--bg)}
.editbox{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.editbox textarea{resize:vertical;min-height:72px}
.editbox select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:100%}
.editbox label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.donehead{margin:22px 0 8px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.donehead button{border:0;background:none;color:var(--accent);padding:0;text-decoration:underline}
.export{width:100%;height:220px;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
.saved{font-size:12px;color:var(--muted);padding:0 2px}
.auth{margin:auto;max-width:380px;width:100%;padding:28px 20px;display:flex;flex-direction:column;gap:12px}
.auth h1{flex:none}
.auth input{padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.auth .err{min-height:20px}
.auth p{color:var(--muted);margin:0}
.auth label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.auth label input{color:var(--ink);font-size:16px}
.auth .hint{font-size:13px}
.err{color:var(--danger);font-size:14px}
.import{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.import .err{min-height:20px}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;text-decoration:underline;align-self:flex-start}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.small{font-size:13px;color:var(--muted)}
.card,.banner{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px}
.banner{border-color:var(--accent)}
.card h2{font:700 18px var(--font-display);margin:0}
.card p,.banner p{margin:0}
.card .row{display:flex;gap:10px;align-items:center}
.card .row input{width:19px;height:19px;accent-color:var(--accent);flex:none}
.card form{display:flex;flex-direction:column;gap:8px;max-width:360px}
.card form label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.card form input{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.vers{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;max-height:340px;overflow-y:auto}
.vers li{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.vers li:last-child{border-bottom:0}
.vers li.on{background:var(--bg)}
.vers .when{flex:1;min-width:0}
.vers .when small{display:block;color:var(--muted)}
.preview{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.preview ul{margin:0;padding-left:20px}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,160%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;display:flex;gap:16px;align-items:center;box-shadow:0 4px 18px rgba(0,0,0,.25);transition:transform .2s;z-index:10;max-width:calc(100vw - 32px)}
.toast.show{transform:translate(-50%,0)}
.toast .linkbtn{color:var(--bg);font-weight:600;align-self:auto}
@media (max-width:760px){
  .side{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:transform .2s;width:min(300px,86vw)}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .menu{display:inline-block}
}
@media (prefers-reduced-motion:reduce){.side,.toast{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script id="state" type="application/json">{"rev":0,"lists":[]}</script>
<script id="code">
(function(){
/* App version. When changing the page, bump this AND the CACHE name in sw.js to match (the test checks they agree). */
var APP_VERSION='1.3.1';
/* Push notifications are built but switched off for now (calendar reminders only). Set to true to bring them back;
   the GitHub job (.github/workflows/reminders.yml) also needs enabling and a valid DATA_TOKEN secret. */
var PUSH_ON=false;
var S=JSON.parse(document.getElementById('state').textContent);
var LSK='my-lists-state-v1';
try{var l=JSON.parse(localStorage.getItem(LSK)||'null'); if(l&&l.rev>S.rev) S=l;}catch(e){}
var cur=(S.lists[0]||{}).id, q='', editing=null, showDone={}, drawer=false, adding=false, confirmDel=false, exportText=null, focusNew=false, view='lists';
var cloud={user:null, status:'', authErr:'', busy:false, confirmOut:false, needImport:false, importErr:'', pass:null, passErr:'', passEnc:null, passRemote:null, encrypting:false, offerWipe:false},
    pushTimer=null, pollTimer=null, inflight=false, again=false;
var sett={pinOpen:false, pinErr:'', bioErr:'', passOpen:false, passErr:'', wipeConfirm:false, wipeBusy:false, wipeMsg:'', hist:null, prev:null};
function uid(){return Math.random().toString(36).slice(2,9);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function byId(id){return S.lists.find(function(x){return x.id===id;});}
function lsSave(){try{localStorage.setItem(LSK,JSON.stringify(S));}catch(e){}}

function save(){
  S.rev=(S.rev||0)+1; lsSave(); setDirty(true);
  if(cloud.user){cloud.status='Saving…';paintStatus();clearTimeout(pushTimer);pushTimer=setTimeout(pushNow,1500);if(PUSH_ON)scheduleRem();}
}
function paintStatus(){var e=document.getElementById('status');if(e)e.textContent=cloud.status;}

/* Sync: the lists live as one JSON file in a PRIVATE GitHub repo, read and written with the GitHub
   contents API using a fine-grained token kept on this device. Each save is a commit (history = backups).
   Newest rev wins: a write carries the file's last known sha; if someone else saved first GitHub refuses it,
   we re-read, and keep whichever copy has the higher rev. localStorage keeps a copy so it works offline.
   Encryption: the file is AES-GCM encrypted with a key derived (PBKDF2-SHA256) from the user's passphrase.
   The derived key is kept on each device (like the token); the passphrase itself is never stored. */
var GHK='my-lists-gh', TKK='my-lists-token', DIRTYK='my-lists-dirty', SHAK='my-lists-sha', KEYK='my-lists-key',
    LOCKK='my-lists-lock', FAILK='my-lists-lockfails', SNDK='my-lists-sound', VIBK='my-lists-vibrate';
var KDF_ITER=600000, PIN_ITER=150000;
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}
function lsJson(k){try{return JSON.parse(ls(k)||'null');}catch(e){return null;}}
function getCfg(){return lsJson(GHK);}
function setDirty(v){ls(DIRTYK,v?'1':null);}
function isDirty(){return ls(DIRTYK)==='1';}
function codeErr(c){var e=new Error(c);e.code=c;return e;}
function b64enc(str){return b64u8(new TextEncoder().encode(str));}
function b64dec(b64){return new TextDecoder().decode(u8(b64));}
function u8(b64){var bin=atob(String(b64).replace(/\s/g,'')),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
function b64u8(buf){var b=new Uint8Array(buf),s='';for(var i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}
function rand(n){return crypto.getRandomValues(new Uint8Array(n));}
function validState(s){return s&&typeof s==='object'&&Array.isArray(s.lists)&&s.lists.every(function(L){return L&&typeof L.id==='string'&&typeof L.name==='string'&&Array.isArray(L.tasks);});}

/* ---- encryption ---- */
function deriveBits(secret,salt,iter){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(secret),'PBKDF2',false,['deriveBits'])
    .then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:salt,iterations:iter},k,256);});
}
function getKeyInfo(){return lsJson(KEYK);}   /* {salt, iter, k} (base64) */
var keyCache=null;
function aesKey(info){
  if(keyCache&&keyCache.k===info.k)return Promise.resolve(keyCache.key);
  return crypto.subtle.importKey('raw',u8(info.k),'AES-GCM',false,['encrypt','decrypt']).then(function(key){keyCache={k:info.k,key:key};return key;});
}
function makeKey(pass,salt64,iter){
  return deriveBits(pass,u8(salt64),iter).then(function(bits){return {salt:salt64,iter:iter,k:b64u8(bits)};});
}
function isEnc(o){return !!o&&o.myLists==='enc1';}
function encryptState(state,info){
  var iv=rand(12);
  return aesKey(info).then(function(key){return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(JSON.stringify(state)));})
    .then(function(ct){return JSON.stringify({myLists:'enc1',note:'My Lists data, encrypted (AES-GCM, key from passphrase via PBKDF2-SHA256)',kdf:'PBKDF2-SHA256',iter:info.iter,salt:info.salt,iv:b64u8(iv),ct:b64u8(ct)});});
}
function decryptWith(o,info){
  return aesKey(info).then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:u8(o.iv)},key,u8(o.ct));})
    .then(function(pt){return JSON.parse(new TextDecoder().decode(pt));});
}
/* text of the repo file -> Promise {state, plain}; rejects 'need-pass' (err.enc = file) when this device can't decrypt it */
function openFile(text){
  var o;try{o=JSON.parse(text);}catch(e){return Promise.reject(codeErr('bad-file'));}
  if(!isEnc(o))return validState(o)?Promise.resolve({state:o,plain:true}):Promise.reject(codeErr('bad-file'));
  var info=getKeyInfo(),np=codeErr('need-pass');np.enc=o;
  if(!info||info.salt!==o.salt)return Promise.reject(np);
  return decryptWith(o,info).then(function(s){if(!validState(s))throw codeErr('bad-file');return {state:s,plain:false};},function(){throw np;});
}

window.Cloud=(function(){
  var authCb=null;
  function base(){return ls('my-lists-api')||'https://api.github.com';}
  function enc(p){return String(p).split('/').map(encodeURIComponent).join('/');}
  function repoUrl(c){return '/repos/'+enc(c.owner)+'/'+enc(c.repo);}
  function fileUrl(c){return repoUrl(c)+'/contents/'+enc(c.path);}
  function req(method,path,body,tok){
    var hd={'Authorization':'Bearer '+(tok||ls(TKK)),'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
    if(body)hd['Content-Type']='application/json';
    return fetch(base()+path,{method:method,cache:'no-store',headers:hd,body:body?JSON.stringify(body):undefined})
      .catch(function(){throw codeErr('network');})
      .then(function(r){
        if(r.status===401)throw codeErr('bad-token');
        if(r.status===403||r.status===429)throw codeErr(r.headers.get('x-ratelimit-remaining')==='0'?'rate-limit':'forbidden');
        return r;
      });
  }
  function json(r){if(!r.ok)throw codeErr('http-'+r.status);return r.json();}
  return {
    onAuth:function(cb){authCb=cb;cb(ls(TKK)&&getCfg()?getCfg():null);},
    signIn:function(tok,cfg){
      return req('GET',repoUrl(cfg),null,tok).then(function(r){
        if(r.status===404)throw codeErr('no-repo');
        return json(r);
      }).then(function(repo){
        if(repo.private!==true)throw codeErr('public-repo');
        ls(TKK,tok);ls(GHK,JSON.stringify(cfg));if(authCb)authCb(cfg);
      });
    },
    signOut:function(){[TKK,LSK,DIRTYK,SHAK,KEYK,LOCKK,FAILK,'my-lists-device'].forEach(function(k){ls(k,null);});keyCache=null;if(authCb)authCb(null);},
    /* resolves null when the file does not exist (at ref), else {state, sha, plain} */
    get:function(ref){
      return req('GET',fileUrl(getCfg())+(ref?'?ref='+encodeURIComponent(ref):'')).then(function(r){
        if(r.status===404)return null;
        return json(r).then(function(j){
          var text;try{text=b64dec(j.content);}catch(e){throw codeErr('bad-file');}
          return openFile(text).then(function(f){f.sha=j.sha;return f;});
        });
      });
    },
    /* encrypts and saves; resolves {sha} when saved, {conflict:true} when the file changed since `sha` */
    push:function(state,sha){
      var info=getKeyInfo();if(!info)return Promise.reject(codeErr('need-pass'));
      return encryptState(state,info).then(function(text){
        var body={message:'Update lists (rev '+state.rev+')',content:b64enc(text)};if(sha)body.sha=sha;
        return req('PUT',fileUrl(getCfg()),body);
      }).then(function(r){
        if(r.status===409||r.status===422)return {conflict:true};
        return json(r).then(function(j){return {sha:j.content.sha};});
      });
    },
    /* any other file in the data repo (used for reminders.json): null or {text, sha} */
    getRaw:function(path){
      var c=getCfg();
      return req('GET',repoUrl(c)+'/contents/'+enc(path)).then(function(r){if(r.status===404)return null;return json(r).then(function(j){return {text:b64dec(j.content),sha:j.sha};});});
    },
    putRaw:function(path,text,sha,msg){
      var c=getCfg(),body={message:msg,content:b64enc(text)};if(sha)body.sha=sha;
      return req('PUT',repoUrl(c)+'/contents/'+enc(path),body).then(function(r){if(r.status===409||r.status===422)return {conflict:true};return json(r).then(function(j){return {sha:j.content.sha};});});
    },
    /* latest run of the reminder sender (a GitHub Actions workflow in the public site repo) */
    lastRun:function(ownerRepo){
      return req('GET','/repos/'+enc(ownerRepo)+'/actions/workflows/reminders.yml/runs?per_page=1').then(function(r){if(r.status===404)return null;return json(r);}).then(function(j){return j&&j.workflow_runs&&j.workflow_runs[0]||(j?{none:true}:null);});
    },
    /* saved versions of the file, newest first */
    commits:function(){var c=getCfg();return req('GET',repoUrl(c)+'/commits?per_page=40&path='+encodeURIComponent(c.path)).then(json);},
    /* replace the branch history with one commit holding the current files (drops older, unencrypted saves) */
    wipe:function(){
      var c=getCfg(),R=repoUrl(c),br;

function pad(n){return (n<10?'0':'')+n;}
function dayStr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayStr(){return dayStr(new Date());}
function tomorrowStr(){var n=new Date();return dayStr(new Date(n.getFullYear(),n.getMonth(),n.getDate()+1));}
function parseDay(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
/* when it is due (ms); date-only tasks count as 09:00 for reminders */
function dueAt(t){if(!t.d)return null;var d=parseDay(t.d),h=9,m=0;if(t.tm){var q=t.tm.split(':');h=+q[0];m=+q[1];}d.setHours(h,m,0,0);return d.getTime();}
function dueKind(t){
  if(!t.d||t.done)return null;
  var td=todayStr();
  if(t.d<td||(t.d===td&&t.tm&&dueAt(t)<Date.now()))return 'over';
  return t.d===td?'today':'later';
}
function fmtDay(s){return parseDay(s).toLocaleDateString([], {weekday:'short',day:'numeric',month:'short'});}
function dueLabel(t){var day=t.d===todayStr()?'Today':t.d===tomorrowStr()?'Tomorrow':fmtDay(t.d);return day+(t.tm?' '+t.tm:'');}
function dueChip(t){
  var k=dueKind(t);if(!k)return '';
  return '<span class="due '+k+'">'+(k==='over'?'Overdue: ':'Due ')+esc(dueLabel(t))+(t.rem?' · reminder':'')+'</span>';
}
function dueTasks(){var r=[];S.lists.forEach(function(L){L.tasks.forEach(function(t){if(t.d&&!t.done)r.push([L,t]);});});return r.sort(function(a,b){return dueAt(a[1])-dueAt(b[1]);});}
function hotCount(){return dueTasks().filter(function(r){var k=dueKind(r[1]);return k==='over'||k==='today';}).length;}
function dueHtml(){
  var all=dueTasks(),td=todayStr(),n=new Date(),wk=dayStr(new Date(n.getFullYear(),n.getMonth(),n.getDate()+7));
  var groups=[['over','Overdue',[]],['today','Today',[]],['week','Next 7 days',[]],['later','Later',[]]];
  all.forEach(function(r){var t=r[1],k=dueKind(t);groups[k==='over'?0:k==='today'?1:t.d<=wk?2:3][2].push(r);});
  var h='<div class="top"><button class="btn menu" data-act="drawer" aria-label="Show lists">Lists</button><h1>Due</h1></div><p class="meta">'+all.length+' open task'+(all.length===1?'':'s')+' with a due date</p>';
  if(!all.length)return h+'<div class="tasks"><div class="empty">Nothing has a due date yet. Edit a task to give it one.</div></div>';
  groups.forEach(function(g){if(g[2].length)h+='<div class="duehead '+g[0]+'">'+g[1]+' ('+g[2].length+')</div><ul class="tasks">'+g[2].map(function(r){return taskHtml(r[0],r[1],true);}).join('')+'</ul>';});
  return h;
}
/* calendar event (.ics) so the phone's own calendar sounds the alert */
function icsText(t,L){
  function esc2(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');}
  function fold(line){var out='';while(line.length>73){out+=line.slice(0,73)+'\r\n ';line=line.slice(73);}return out+line;}
  var named=!!(S.prefs&&S.prefs.calNames),title=named?t.t:'My Lists reminder',d=t.d.replace(/-/g,''),now=new Date(),lines;
  var stamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+pad(now.getUTCSeconds())+'Z';
  if(t.tm){
    var st=new Date(dueAt(t)),en=new Date(dueAt(t)+30*60000);
    function loc(x){return dayStr(x).replace(/-/g,'')+'T'+pad(x.getHours())+pad(x.getMinutes())+'00';}
    lines=['DTSTART:'+loc(st),'DTEND:'+loc(en)];
  } else {
    var nx=parseDay(t.d);nx.setDate(nx.getDate()+1);
    lines=['DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+dayStr(nx).replace(/-/g,'')];
  }
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//My Lists//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT',
    'UID:'+t.id+'@my-lists','DTSTAMP:'+stamp].concat(lines,[
    'SUMMARY:'+esc2(title),'DESCRIPTION:'+esc2(named?'From My Lists ('+L.name+')':'Open My Lists to see what is due.'),
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+esc2(title),'TRIGGER'+(t.tm?':-PT0M':':PT9H'),'END:VALARM',
    'END:VEVENT','END:VCALENDAR']).map(fold).join('\r\n')+'\r\n';
}
function downloadFile(name,text,type){
  var url=URL.createObjectURL(new Blob([text],{type:type})),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},60000);
}

function countTasks(st){var t=0,o=0;st.lists.forEach(function(L){t+=L.tasks.length;o+=openCount(L);});return {t:t,o:o};}
function diffHtml(old){
  var nowL={},oldL={},nowT={},oldT={};
  S.lists.forEach(function(L){nowL[L.id]=1;L.tasks.forEach(function(t){nowT[t.id]=1;});});
  old.lists.forEach(function(L){oldL[L.id]=1;L.tasks.forEach(function(t){oldT[t.id]=1;});});
  function names(arr){var n=arr.slice(0,8).map(function(x){return '<li>'+esc(x)+'</li>';}).join('');return n+(arr.length>8?'<li>and '+(arr.length-8)+' more</li>':'');}
  var backL=old.lists.filter(function(L){return !nowL[L.id];}).map(listLabel),
      goneL=S.lists.filter(function(L){return !oldL[L.id];}).map(listLabel),
      backT=[],goneT=[];
  old.lists.forEach(function(L){if(nowL[L.id])L.tasks.forEach(function(t){if(!nowT[t.id])backT.push(t.t+' ('+L.name+')');});});
  S.lists.forEach(function(L){if(oldL[L.id])L.tasks.forEach(function(t){if(!oldT[t.id])goneT.push(t.t+' ('+L.name+')');});});
  var h='';
  if(backL.length)h+='<p>Brings back these lists:</p><ul>'+names(backL)+'</ul>';
  if(backT.length)h+='<p>Brings back these tasks:</p><ul>'+names(backT)+'</ul>';
  if(goneL.length)h+='<p>Removes these lists (added since):</p><ul>'+names(goneL)+'</ul>';
  if(goneT.length)h+='<p>Removes these tasks (added since):</p><ul>'+names(goneT)+'</ul>';
  return h||'<p>Same lists and tasks as now (ticks, names or notes may differ).</p>';
}

/* Chiptune "level up" when a task is ticked off, made with Web Audio (no sound files).
   allDone = that was the last open task in the list, so it plays a longer fanfare. */
var audioCtx=null;
function winSound(allDone){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    var c=audioCtx,t0=c.currentTime+0.01,out=c.createGain();
    out.gain.value=0.18;out.connect(c.destination);
    function note(f,start,len,type,vol){
      var o=c.createOscillator(),g=c.createGain();
      o.type=type||'square';o.frequency.setValueAtTime(f,t0+start);
      g.gain.setValueAtTime(0,t0+start);
      g.gain.linearRampToValueAtTime(vol||1,t0+start+0.005);
      g.gain.exponentialRampToValueAtTime(0.001,t0+start+len);
      o.connect(g);g.connect(out);o.start(t0+start);o.stop(t0+start+len+0.02);
    }
    // quick rising arpeggio C6 E6 G6 C7, with a soft triangle "sparkle" an octave up
    var arp=[1046.5,1318.5,1568,2093];
    arp.forEach(function(f,i){note(f,i*0.055,0.12,'square',0.8);note(f*2,i*0.055+0.02,0.08,'triangle',0.35);});
    if(allDone){
      // list cleared: a little victory fanfare on top
      [[1568,0.26,0.1],[1568,0.37,0.1],[2093,0.48,0.45]].forEach(function(n){note(n[0],n[1],n[2],'square',0.9);note(n[0]/2,n[1],n[2],'triangle',0.6);});
    }
  }catch(err){}
}

  var m=document.getElementById('mainpane');
  if(m){var mr=m.getBoundingClientRect();if(e.clientY<mr.top+48)m.scrollTop-=12;else if(e.clientY>mr.bottom-48)m.scrollTop+=12;}
},{passive:false});
function endDrag(e){
  if(!drag||(e&&e.pointerId!==drag.pid))return;
  var d=drag;drag=null;d.li.classList.remove('dragging');
  if(d.moved){var L=byId(d.ul.getAttribute('data-list'));if(L){applyOrder(L,[].map.call(d.ul.children,function(x){return x.getAttribute('data-id');}));save();}}
  renderLater=false;render();
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);
document.addEventListener('change',function(e){
  if(e.target.id!=='importfile'||!e.target.files[0])return;
  e.target.files[0].text().then(function(text){
    var s;try{s=importText(text);}catch(x){cloud.importErr='That file has no lists in it.';render();return;}
    S=s;cur=(S.lists[0]||{}).id;cloud.needImport=false;cloud.importErr='';lsSave();setDirty(true);ls(SHAK,null);render();pushNow();
  });
});
/* opened from a notification: ./?task=<id> -> show that task's list */
(function(){
  var m=/[?&]task=([^&]+)/.exec(location.search);if(!m)return;
  var tid=decodeURIComponent(m[1]),L=S.lists.find(function(x){return x.tasks.some(function(t){return t.id===tid;});});
  if(L){cur=L.id;view='lists';}
  try{history.replaceState(null,'',location.pathname);}catch(e){}
})();
navigator.serviceWorker&&navigator.serviceWorker.addEventListener&&navigator.serviceWorker.addEventListener('message',function(e){
  var d=e.data||{};if(d.type!=='open-task')return;
  var L=S.lists.find(function(x){return x.tasks.some(function(t){return t.id===d.task;});});
  if(L){cur=L.id;view='lists';q='';drawer=false;render();}
});
initCloud();
})();
</script>
<script>
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script>
